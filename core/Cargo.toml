[package]
name = "glasklang-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Glasklang library core: SQLite library, scanner, tag reading, playlists, M3U"

[dependencies]
anyhow = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
