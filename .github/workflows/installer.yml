name: Installer (build Glasklang setup)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build installer (per-user, no admin needed)
        run: npm run tauri -- build --config src-tauri/tauri.nsis.conf.json

      - name: Keep the installer as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glasklang-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
