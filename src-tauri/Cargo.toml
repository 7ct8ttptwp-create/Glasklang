[package]
name = "glasklang"
version = "0.1.0"
description = "Glasklang - a fast, private, liquid-glass music player"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
glasklang-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
